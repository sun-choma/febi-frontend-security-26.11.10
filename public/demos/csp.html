<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The same policy a server would send as a header -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Demo: the same post, with a CSP</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <p class="demo-note">Demo: the same post with <b>default-src 'self'</b>. Open DevTools → <b>Console</b>: the browser refuses the inline onerror. Network stays clean</p>
  <article id="post"></article>
  <script src="post.js"></script>
</body>
</html>
