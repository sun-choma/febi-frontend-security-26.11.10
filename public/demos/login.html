<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo: javascript: in ?next=</title>
  <link rel="stylesheet" href="demo.css">
  <script src="steal.js"></script>
</head>
<body>
  <p class="demo-note">Demo: look at the URL bar, then press Continue with DevTools → <b>Network</b> open</p>
  <p>Signed in. Back to where you were?</p>
  <button id="go">Continue</button>
  <script>
    const next = new URLSearchParams(location.search).get('next') ?? './'
    document.getElementById('go').onclick = () => {
      location.href = next // a javascript: URL runs as code on this page
    }
  </script>
</body>
</html>
